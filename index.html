<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f9fd;--surf:#fff;--ink:#33546b;--sub:#7c8fa0;--line:#e3e9f0;--soft:#eef2f7;--mint:#e3f6f2;
  --acc:#eb5e78;--acc2:#d94a65;--bar:rgba(255,255,255,.96);--shadow:0 2px 10px rgba(51,84,107,.12);
  --gp:#f9c5cb;--gpb:#eb5e78;--gpn:#b3243f;
  --gb:#9fe0d6;--gbb:#2fb5a5;--gbn:#0f6f63;
  --gg:#d3c9f0;--ggb:#8c78d6;--ggn:#4b3a9a;
  --gy:#f2ec8a;--gyb:#d9c520;--gyn:#6b5f00;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#16212b;--surf:#213040;--ink:#e8eef4;--sub:#9db0c1;--line:#33475a;--soft:#2a3a4b;--mint:#1f3a3a;--bar:rgba(26,38,50,.96);--shadow:0 2px 10px rgba(0,0,0,.4)}
}
:root[data-theme="dark"]{--bg:#16212b;--surf:#213040;--ink:#e8eef4;--sub:#9db0c1;--line:#33475a;--soft:#2a3a4b;--mint:#1f3a3a;--bar:rgba(26,38,50,.96);--shadow:0 2px 10px rgba(0,0,0,.4)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hw{font-weight:700}
#app{max-width:480px;margin:0 auto;padding:0 14px 110px}

/* header */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 0 6px}
.logo{font-weight:900;font-size:17px}
.pt{margin:10px 0 12px;font-size:24px;font-weight:900}
.h3{margin:22px 0 8px;font-size:16px;font-weight:900}
.dim{color:var(--sub)}p.dim{margin:6px 2px}
.hero{text-align:center;padding:22px 0 8px}
.hero h1{margin:0;font-size:28px;line-height:1.5;font-weight:900}
.stats{display:flex;justify-content:center;gap:18px;margin:14px 0 18px;color:var(--sub);font-weight:700;font-size:12px}
.stats b{font-size:20px;color:var(--ink);margin-right:3px}
.hero .btn{width:100%;margin-top:10px}
.panel{background:var(--mint);border-radius:18px;padding:16px 12px 14px;margin:18px 0 6px}
.panel p{margin:0 4px 10px;font-weight:900;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border:0;border-radius:14px;background:var(--tc);color:var(--tn);padding:12px 4px 10px;font-size:11px;font-weight:900;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow)}
.tile span:first-child{font-size:24px}

/* paper sheet */
.sheet{background:var(--surf);color:var(--ink);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.sheet.click{cursor:pointer}
.sh{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;margin-bottom:2px;border-bottom:2px solid var(--line)}
.sh b{font-size:15px;font-weight:900}.sh span{font-size:12px;color:var(--sub)}
.mr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);min-height:44px}
.mr:last-of-type{border-bottom:0}
.no{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font:900 12px/22px "Noto Sans JP",sans-serif;text-align:center;font-style:normal;flex:none}
.mt{font-size:12px;font-weight:700;color:var(--sub);width:1.8em;flex:none}
.mn{flex:1;font-weight:700;font-size:13.5px;line-height:1.35}
.empty-t{margin:10px 2px;color:var(--sub);line-height:1.7}
.note-l{margin:6px 0 0;font-size:12px;color:var(--sub)}

/* category colors */
.g-shu{--tc:var(--gp);--tb:var(--gpb);--tn:var(--gpn)}
.g-main{--tc:var(--gb);--tb:var(--gbb);--tn:var(--gbn)}
.g-side{--tc:var(--gg);--tb:var(--ggb);--tn:var(--ggn)}
.g-all{--tc:var(--gy);--tb:var(--gyb);--tn:var(--gyn)}
.tab{display:inline-block;padding:1px 10px;background:var(--tc);color:var(--tn);font-weight:900;font-size:13px;line-height:1.6;border-radius:999px;text-align:center;min-width:32px}
.bag>.tab{position:absolute;top:8px;left:8px;z-index:2;background:#fff;color:var(--tn);box-shadow:0 1px 4px rgba(51,84,107,.25)}

/* card */
.bag{position:relative;display:block;width:100%;text-align:left;color:var(--ink);background:var(--surf);border:2px solid transparent;border-radius:16px;box-shadow:var(--shadow);margin:0 0 12px;padding:0;cursor:pointer}
.bag.on{border-color:var(--acc)}
.paper{display:block;padding:0 0 10px;border-radius:14px;overflow:hidden}
.ph{display:block;aspect-ratio:4/3;background:var(--tc,var(--soft));position:relative;overflow:hidden}
.ph svg,.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pill{display:inline-block;background:var(--tc);color:var(--tn);font-size:10px;font-weight:900;border-radius:10px;padding:1px 8px;margin:8px 0 0 10px}
.nm{display:block;font-weight:900;font-size:14px;line-height:1.4;margin:3px 10px 0}
.al{display:flex;gap:3px;flex-wrap:wrap;margin:4px 10px 0;min-height:14px}
.al i{font-style:normal;font-size:9.5px;border:1px solid #e58a98;color:#c23a55;border-radius:7px;padding:0 5px;font-weight:700}
.badge{position:absolute;right:-6px;top:-8px;z-index:3;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font:900 14px/26px "Noto Sans JP",sans-serif;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.star{position:absolute;right:8px;top:8px;z-index:3;width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-size:16px;line-height:30px;padding:0;color:#e6a100}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px}
.cnt{margin:8px 2px 10px;font-size:12px;color:var(--sub);font-weight:700}

/* board */
.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--surf);color:var(--ink);border-radius:16px;padding:10px 10px 12px;box-shadow:0 4px 16px rgba(51,84,107,.22);margin-bottom:12px}
.board-h{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:14px}
.board-h span{font-size:13px;color:var(--sub)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.slot{position:relative;min-height:160px;border:2px dashed var(--line);border-radius:12px;background:var(--soft);padding:0 3px 3px}
.slot.over{border-color:var(--acc);background:rgba(235,94,120,.12)}
.slot .no{position:absolute;left:5px;top:5px;z-index:4}
.slot em{position:absolute;right:7px;top:6px;z-index:4;font-size:12px;font-weight:700;color:var(--sub);font-style:normal}
.slot .empty{display:flex;align-items:center;justify-content:center;height:150px;font-size:12px;line-height:1.6;color:var(--sub);text-align:center;font-weight:700}
.slot .bag{margin:30px 0 0;touch-action:none;cursor:grab;box-shadow:0 1px 6px rgba(51,84,107,.2)}
.slot .bag .nm{font-size:11px;margin:2px 6px 0}
.slot .bag .pill{font-size:8px;margin:5px 0 0 6px;padding:0 6px}
.slot .bag .paper{padding-bottom:6px}
.slot .bag>.tab{font-size:11px;min-width:24px;top:5px;left:5px;padding:0 7px}
.slot .bag.dragging{z-index:30;opacity:.92;box-shadow:0 12px 26px rgba(0,0,0,.35);cursor:grabbing}
.tape{display:none}
.x{position:absolute;right:-6px;top:-8px;z-index:5;width:24px;height:24px;border:0;border-radius:50%;background:var(--ink);color:var(--surf);font-size:12px;line-height:24px;padding:0}
.tools{display:flex;gap:8px;margin:6px 0 10px}
.tools .btn{flex:1;padding:9px 10px;font-size:13px}
.edb{background:#fff3c4;color:#5a4a00;border-radius:10px;padding:8px 12px;margin-bottom:8px;font-weight:700;font-size:13px}

/* filters */
.fbar{display:flex;gap:8px}
.fbar input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surf);color:var(--ink);font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.chip{border:2px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--surf);border-color:var(--ink)}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--tb)}
.fpanel{background:var(--soft);border-radius:12px;padding:10px;margin:8px 0;display:grid;gap:8px}
.fpanel label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.fpanel select{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surf);color:var(--ink)}
.fpanel .sub{font-size:12px;color:var(--sub)}

/* buttons */
.btn{border:2px solid var(--line);background:var(--surf);color:var(--ink);border-radius:10px;padding:12px 16px;font-weight:700;font-size:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.lg{padding:15px 18px;font-size:16px;flex:1}
.btn.sm{padding:6px 12px;font-size:12px;margin-top:6px}
.btn.warn{background:#b3243f;border-color:#b3243f;color:#fff}
.sheet .btn{margin-top:8px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts .btn{flex:1;white-space:nowrap}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));width:min(452px,calc(100% - 28px));z-index:15;display:flex}
.cta .btn{box-shadow:0 8px 20px rgba(235,94,120,.45)}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:15;width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:28px;box-shadow:0 6px 16px rgba(235,94,120,.5)}

/* nav */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);z-index:20;display:flex;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(8px)}
#nav button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11px;font-weight:700;color:var(--sub);position:relative}
#nav button b{display:flex;justify-content:center;margin-bottom:2px;font-weight:400}
.ni{width:23px;height:23px}
#nav button.on{color:var(--acc)}
#nav .c{position:absolute;top:2px;left:57%;background:var(--acc);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:16px}

/* overlays */
.layer{position:fixed;inset:0;z-index:50;overflow-y:auto;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.layer.modal{background:rgba(20,35,50,.55);display:flex;align-items:flex-end}
.sheetm{background:var(--surf);color:var(--ink);width:min(480px,100%);margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px 24px;max-height:92vh;overflow:auto}
.sheetm h3{margin:0 0 8px;font-weight:900}
.sheetm label,.form label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
.sheetm input,.sheetm textarea,.sheetm select,.form input,.form textarea,.form select{width:100%;border:2px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surf);color:var(--ink);font-size:15px}
.ovh{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.ovh b{font-size:15px}
.ib{border:0;background:none;font-size:16px;font-weight:700;padding:8px 10px;color:var(--acc);min-width:64px}
.ib.r{text-align:right;font-size:24px;color:#e6a100}
.ovb{max-width:480px;margin:0 auto;padding:10px 14px 130px}
.bag.big{cursor:default;margin-top:6px}
.bag.big .paper{padding:0 0 16px}
.bag.big .paper>:not(.ph){margin-left:16px;margin-right:16px}
.bag.big>.tab{font-size:16px;top:12px;left:12px;padding:1px 14px}
.bag.big .ph{border-radius:0}
.bubble{position:absolute;left:12px;bottom:12px;max-width:62%;background:#fff;color:#33546b;border-radius:12px;padding:6px 10px;font-size:11.5px;line-height:1.4;box-shadow:0 2px 8px rgba(51,84,107,.25)}
.bubble b{display:block;font-size:10px;color:#7c8fa0;margin-bottom:1px}
.bag.big h2{margin:4px 16px 0;font-size:22px;font-weight:900;line-height:1.35}
.meta{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0;font-size:12px;color:var(--sub);font-weight:700}
.bag.big h4,.sheet h4{margin:16px 0 4px;font-size:13px;font-weight:900}
.ig div{display:flex;gap:8px;border-bottom:1px solid var(--line);padding:6px 0;font-size:13.5px}
.ig span:first-child{flex:1}.ig span:last-child{font-weight:700;white-space:nowrap}
ol.st{list-style:none;padding:0;margin:4px 0;counter-reset:s}
.st li{counter-increment:s;position:relative;padding-left:28px;margin:8px 0;font-size:13.5px;line-height:1.65}
.st li::before{content:counter(s);position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--surf);font:900 11px/20px sans-serif;text-align:center}
.tip{background:var(--soft);border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.6;margin-top:10px}
.warnb{background:rgba(235,94,120,.1);border:1.5px solid #f0a0ae;color:#b3243f;border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.6;margin-top:10px}
.warnb small{display:block;color:#c26a7a;margin-top:3px}
.memo{width:calc(100% - 32px);border:2px solid var(--line);border-radius:10px;padding:9px 12px;min-height:76px;background:var(--surf);color:var(--ink);font-size:15px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum .b{background:var(--soft);border-radius:12px;padding:10px 4px 9px;font-size:11.5px;font-weight:700;line-height:1.35}
.sum .b em{display:block;font-size:11px;color:var(--sub);font-style:normal;margin:4px 0 2px}
.dayc{display:flex;gap:12px}
.dayc .ph{width:96px;flex:none;aspect-ratio:1;border-radius:12px}
.dayc h3{margin:2px 0;font-size:16px;font-weight:900;line-height:1.35}
.dayc .pill{margin:0}
.dhd{display:flex;align-items:center;gap:8px}
.form{background:var(--surf);color:var(--ink);border-radius:16px;padding:6px 14px 16px;margin-top:10px;box-shadow:var(--shadow)}
.form h4{margin:16px 0 4px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.irow{display:flex;gap:6px;margin-bottom:6px}
.irow .in{flex:3}.irow .ia{flex:2}
.x2{border:0;background:var(--soft);border-radius:10px;width:38px;flex:none;color:var(--ink)}
.pv{width:140px;margin-top:6px;border-radius:12px}
.err{color:#b3243f;font-size:12px;margin-top:6px;min-height:14px}
textarea.big{min-height:180px;font:12px/1.5 ui-monospace,Menlo,monospace}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:#33546b;color:#fff;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:700;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.bag:focus-visible{outline:3px solid #2f8fe0;outline-offset:2px}
</style>

{"id":5,"name":"玉ねぎわかめそうめん","cat":"主食","time":15,"ing":"そうめん|15g;玉ねぎ|1.5cm幅のくし形切り1個（15g）;わかめ（乾燥・湯でもどしたもの）|小さじ1/2;だし汁|大さじ1","steps":["そうめんはやわらかくゆでて水にさらし、水けをきって粗みじん切りにする。","玉ねぎは薄切りにし、わかめと一緒にやわらかくゆで、それぞれみじん切りにする。","小鍋に①、②、だし汁を入れ、ひと煮立ちさせる。","器に③を盛り、②をのせる。"],"swap":"玉ねぎ→大根"},
{"id":6,"name":"かぼちゃきな粉がゆ","cat":"主食","time":8,"ing":"7倍がゆ|大さじ3〜5（50〜80g）;かぼちゃ（皮を取り除いたもの）|10g;きな粉|小さじ1/4;水|大さじ1","steps":["かぼちゃは粗みじん切りにして耐熱容器に入れ、水を加え、電子レンジで約40秒加熱する。","器に7倍がゆを盛り、汁けをきった①をのせ、きな粉をかける。"],"swap":"かぼちゃ→にんじん、さつまいも"},
{"id":7,"name":"ほうれん草チーズパンがゆ","cat":"主食","time":12,"ing":"食パン（8枚切り・みみを取り除いたもの）|1/2枚;ほうれん草（葉先）|約2〜3枚（8g）;粉チーズ|小さじ1/4;水|大さじ3","steps":["ほうれん草はやわらかくゆで、水（分量外）にさらしてアク抜きし、みじん切りにする。","食パンはこまかくちぎって耐熱容器に入れ、水を加え、電子レンジで約1分加熱する。","②に①を加えて混ぜ、器に盛り、粉チーズをかける。"],"swap":"ほうれん草→小松菜、ブロッコリー"},
{"id":8,"name":"トマトおかかうどん","cat":"主食","time":8,"ing":"ゆでうどん|1/4玉（45g）;トマト（皮をむき、種を取り除いたもの）|15g;削り節（こまかく砕いたもの）|ひとつまみ","steps":["ゆでうどんはやわらかくゆで、粗みじん切りにする。","トマトはみじん切りにする。","器に①を盛り、②をのせ、湯適宜（分量外）を加え、削り節をかける。"],"swap":"トマト→にんじん、パプリカ"},
{"id":9,"name":"ミモザサラダ風","cat":"主菜","time":20,"ing":"かたゆで卵（沸騰してから12分ゆでたもの）|1/4個;キャベツ（葉先）|10g","steps":["キャベツはやわらかくゆで、みじん切りにする。ゆで汁はとっておく。","かたゆで卵は白身と黄身を分け、それぞれざるなどで裏ごしする。","器に①を盛り、①のゆで汁小さじ1をかけ、②をのせる。"],"swap":"キャベツ→ブロッコリー"},
{"id":10,"name":"しらすにんじん里いもあえ","cat":"主菜","time":20,"ing":"しらす干し|大さじ1（6g）;里いも（冷凍）|約1/2個（10g）;にんじん|1cm厚さの輪切り1/2個（5g）","steps":["里いも、にんじんはやわらかくゆで、それぞれ粗くつぶす。ゆで汁はとっておく。","しらす干しは耐熱容器に入れ、かぶるくらいの水（分量外）を加えて電子レンジで約20秒加熱して塩抜きし、みじん切りにする。","①と②を混ぜ合わせ、①のゆで汁適宜を加え、食べやすい水分量に調節する。"],"tip":"にんじんは水からゆで、沸騰したら里いも（冷凍）を入れて10分ほどゆでます。","swap":"里いも→大根、かぶ"},
{"id":11,"name":"鮭の玉ねぎあえ","cat":"主菜","time":15,"ing":"生鮭（切り身・皮と骨を取り除いたもの）|10g;玉ねぎ|1.5cm幅のくし形切り1個弱（15g）;青のり|少々","steps":["生鮭はしっかり火が通るまでゆで、こまかくほぐす。","玉ねぎはやわらかくゆで、みじん切りにする。ゆで汁はとっておく。","①と②を混ぜ合わせ、②のゆで汁適宜を加え、器に盛り、青のりをかける。"],"swap":"生鮭→鯛、生たら"},

{"id":13,"name":"ささ身と野菜のミルク煮","cat":"主菜","time":15,"ing":"鶏ささ身肉|10g;パプリカ（赤）|5g;キャベツ（葉先）|10g;片栗粉|小さじ1/4;A 牛乳（または湯で溶いた粉ミルク）|小さじ1;A 水|大さじ2","steps":["鶏ささ身肉はしっかり火が通るまでゆで、すりつぶす。","パプリカは皮をむき、キャベツと一緒にやわらかくゆで、それぞれみじん切りにする。","小鍋に①、②、Aを入れ、片栗粉を加えて混ぜながら、とろみがつくまで煮る。"],"tip":"パプリカは、縦に2cm幅くらいの大きさに切り、皮をむいてからみじん切りにするのが◎。","swap":"キャベツ→白菜、パプリカ→にんじん"},
{"id":14,"name":"鶏ひき肉とかぶのみぞれ煮","cat":"主菜","time":10,"ing":"鶏ひき肉（胸肉）|10g;かぶ（すりおろしたもの）|10g;かぶの葉（葉先）|2g;片栗粉|小さじ1/4;水|大さじ3","steps":["かぶの葉はみじん切りにする。","小鍋に①とすべての材料を入れて混ぜ、弱火で鶏ひき肉にしっかり火が通るまで煮て、すりつぶす。"],"swap":"かぶ→大根、かぶの葉→大根の菜"},
{"id":15,"name":"豆腐となすのだし煮","cat":"主菜","time":12,"ing":"豆腐（絹ごし）|30g;なす|1cm厚さの輪切り1個（10g）;だし汁|大さじ2","steps":["豆腐は5mm角に切る。","なすは皮をむいてやわらかくゆで、みじん切りにする。","小鍋に①、②、だし汁を入れ、ひと煮立ちさせる。"],"swap":"なす→ズッキーニ"},
{"id":16,"name":"納豆トマトあえ","cat":"主菜","time":8,"ing":"納豆（ひき割り）|大さじ1½（15g）;トマト（皮をむき、種を取り除いたもの）|10g","steps":["納豆は茶こしに入れ、熱湯を回しかけて軽く粘りを取り、ほぐす。","トマトは粗みじん切りにする。","①と②を混ぜ合わせる。"],"tip":"納豆の粘り取りは、スプーンで軽くかき混ぜながら、納豆が白っぽくほぐれてきたらOK。適度なとろみを生かします。","swap":"納豆→豆腐（絹ごし）、枝豆（みじん切り）"},
{"id":17,"name":"かぼちゃのマッシュ","cat":"副菜","time":8,"ing":"かぼちゃ（皮を取り除いたもの）|15g;水|大さじ1","steps":["かぼちゃは薄切りにして耐熱容器に入れ、水を加え、電子レンジで約1分加熱する。ゆで汁はとっておく。","①をフォークなどで粗くつぶし、①のゆで汁適宜を加え、食べやすいかたさに調節する。"],"arr":"バナナを加えてみても"},
{"id":18,"name":"りんごのとろとろ煮","cat":"副菜","time":6,"ing":"りんご|1.5cm幅のくし形切り1個（15g）;片栗粉|小さじ1/4;水|大さじ2","steps":["りんごはみじん切りにして耐熱容器に入れ、片栗粉、水を加えて混ぜ、電子レンジで約1分加熱し、混ぜ合わせる。"],"tip":"片栗粉、水を加えて混ぜたら、すぐに電子レンジへ（片栗粉が沈殿する前に）。加熱後、とろみがついていなければ、様子を見ながらさらに加熱を。","arr":"プレーンヨーグルトをかけても"},
{"id":19,"name":"にんじんと大根のおかか煮","cat":"副菜","time":12,"ing":"にんじん|1cm厚さの輪切り1個（10g）;大根|約4mm厚さの輪切り1/2個（10g）;削り節（こまかく砕いたもの）|ひとつまみ","steps":["にんじん、大根はやわらかくゆで、みじん切りにする。ゆで汁はとっておく。","小鍋に①、①のゆで汁大さじ1、削り節を入れ、ひと煮立ちさせる。"],"swap":"大根→かぶ"},
{"id":20,"name":"さつまいもみかんあえ","cat":"副菜","time":15,"ing":"さつまいも|1cm厚さの輪切り1/2個（10g）;みかん（小房）|1個（10g）","steps":["さつまいもはやわらかくゆで、つぶす。ゆで汁適宜を加え、食べやすいかたさに調節する。","みかんは薄皮をむき、粗みじん切りにする。","①と②を混ぜ合わせる。"],"tip":"みかんの薄皮は、かたい筋の部分をキッチンばさみや包丁でカットしてからむくとスムーズ。","swap":"さつまいも→じゃがいも"},

{"id":25,"name":"ささ身と野菜の混ぜがゆ","cat":"オールインワン","time":20,"ing":"7倍がゆ|大さじ3〜5（50〜80g）;鶏ささ身肉|10〜15g;にんじん|1cm厚さの輪切り1個（10g）;白菜（葉先）|10g","steps":["鶏ささ身肉はしっかり火が通るまでゆで、すりつぶす。ゆで汁小さじ1を加え、しっとりさせる。","にんじん、白菜はやわらかくゆで、みじん切りにする。","器に7倍がゆを盛り、①、②を加え、混ぜる。"],"swap":"鶏ささ身肉→生鮭、白菜→チンゲンサイ"},

{"id":27,"name":"豆腐とにんじんのミルクパンがゆ","cat":"オールインワン","time":15,"ing":"食パン（8枚切り・みみを取り除いたもの）|1/2枚;豆腐（絹ごし）|30g;にんじん|2cm厚さの輪切り1個（20g）;牛乳|小さじ2","steps":["食パンはこまかくちぎる。","にんじんはやわらかくゆで、みじん切りにする。ゆで汁はとっておく。","小鍋に①、②、②のゆで汁大さじ3、豆腐、牛乳を入れて混ぜ、豆腐を粗くつぶしながらひと煮立ちさせる。"],"swap":"にんじん→ほうれん草、小松菜"},
{"id":28,"name":"まぐろとトマトのパスタ","cat":"オールインワン","time":20,"ing":"マカロニ（早ゆでタイプ）|15g;まぐろ（刺し身）|15g;玉ねぎ|1cm幅のくし形切り1個弱（10g）;トマト（カット・水煮缶）|大さじ1;A 片栗粉|小さじ1/4;A 水|大さじ2","steps":["マカロニはやわらかくゆで、粗みじん切りにする。","まぐろはしっかり火が通るまでゆで、こまかくほぐす。","玉ねぎはやわらかくゆで、みじん切りにする。","小鍋にトマト、Aを入れ、煮る。とろみがついたら、②、③を加えて混ぜる。","器に①を盛り、④をかける。"],"arr":"粉チーズをかけてうまみをプラス!"},
{"id":29,"name":"しらすとチンゲンサイの納豆がゆ","cat":"オールインワン","time":20,"ing":"7倍がゆ|大さじ3〜5（50〜80g）;しらす干し|小さじ1（2g）;納豆（ひき割り）|大さじ1½（15g）;チンゲンサイ（葉先）|20g","steps":["チンゲンサイはやわらかくゆで、みじん切りにする。ゆで汁はとっておく。","納豆は茶こしに入れ、①のゆで汁を回しかけて軽く粘りを取り、ほぐす。","しらす干しは耐熱容器に入れ、かぶるくらいの水（分量外）を加えて電子レンジで約20秒加熱して塩抜きし、みじん切りにする。","器に7倍がゆを盛り、①、②、③をのせる。"],"swap":"チンゲンサイ→トマト、かぶ"},
{"id":30,"name":"鮭とブロッコリーのパンがゆ","cat":"オールインワン","time":15,"ing":"食パン（8枚切り・みみを取り除いたもの）|1/2枚;生鮭（切り身・皮と骨を取り除いたもの）|15g;ブロッコリー（小房）|20g;水|大さじ3〜4","steps":["生鮭はしっかり火が通るまでゆで、こまかくほぐす。","ブロッコリーはやわらかくゆで、穂先のみをみじん切りにする。","食パンはこまかくちぎって耐熱容器に入れ、水を加え、電子レンジで約1分加熱する。","③に①、②を加え、混ぜる。"],"swap":"生鮭→まぐろ"},
{"id":31,"name":"小松菜の卵とじうどん","cat":"オールインワン","time":15,"ing":"ゆでうどん|1/4玉（45g）;溶き卵（全卵）|1/3個分;小松菜（葉先）|15g;長ねぎ（白い部分）|5g;だし汁|1/2カップ","steps":["ゆでうどんはやわらかくゆで、粗みじん切りにする。","小松菜と長ねぎはみじん切りにする。","小鍋に①、②、だし汁を入れ、やわらかくなるまで煮る。","③に溶き卵を回し入れ、弱火で卵にしっかり火が通るまで煮る。"],"arr":"葉もの野菜ならなんでもOK!"},

]
</script>

<script>
/* ================= 設定 ================= */
const SLOTS=['①','②','③'];                       // 1日の枚数・ラベルはここで変更
const CAT_OPTIONS=['主食','主食・主菜','主菜','副菜','オールインワン'];
const STAGES=['5〜6か月','7〜8か月','9〜11か月','12〜18か月'];
const ALLERGENS={卵:['卵'],乳:['牛乳','粉チーズ','粉ミルク','チーズ','ヨーグルト'],小麦:['食パン','うどん','そうめん','マカロニ','パスタ'],大豆:['納豆','豆腐','きな粉','枝豆'],魚:['鮭','かつお','しらす','まぐろ','ツナ','削り節','鯛','たら'],鶏肉:['鶏']};
const GLABEL={'':'すべて',shu:'主食',main:'主菜',side:'副菜',all:'オールインワン'};
const groupOf=cat=>cat.startsWith('主食')?'shu':cat==='主菜'?'main':cat==='副菜'?'side':'all';

/* ================= ユーティリティ ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fmtDate=s=>{const[y,m,d]=s.split('-').map(Number);return `${y}年${m}月${d}日（${'日月火水木金土'[new Date(y,m-1,d).getDay()]}）`};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
const armed={};function arm(k,msg){if(armed[k]&&Date.now()-armed[k]<3000){delete armed[k];return true}armed[k]=Date.now();toast(msg);return false}

/* ================= データ層（カード情報の読み書き） ================= */
const parseIng=s=>String(s).split(';').filter(x=>x.trim()).map(x=>{const i=x.indexOf('|');return i<0?{n:x.trim(),a:''}:{n:x.slice(0,i).trim(),a:x.slice(i+1).trim()}});
const ingStr=a=>a.map(x=>x.n+'|'+x.a).join(';');
function norm(c){return{id:+c.id,name:c.name||'',cat:c.cat||'主菜',stage:c.stage||'7〜8か月',time:+c.time||0,
  ing:typeof c.ing==='string'?parseIng(c.ing):(c.ing||[]),
  steps:Array.isArray(c.steps)?c.steps:String(c.steps||'').split('\n').filter(Boolean),
  tip:c.tip||'',swap:c.swap||'',arr:c.arr||'',caution:c.caution||'',
  allergens:Array.isArray(c.allergens)?c.allergens:String(c.allergens||'').split(/[,、]/).map(x=>x.trim()).filter(Boolean),
  note:c.note||'',photo:c.photo||null}}
const BASE=JSON.parse($('#cards-data').textContent).map(norm);
const KEY='hj_cards_v1';
let DB={custom:[],over:{},favs:[],menus:[],avoid:[]};
try{const r=localStorage.getItem(KEY);if(r)DB={...DB,...JSON.parse(r)}}catch(e){}
/* 参考写真の献立表（R8年9月28日〜10月18日）から、日付ごとの3枚（①〜③）を取り込み。
   すでに同じ日付の献立が保存されている場合は上書きしません。 */
const SEED_MENUS=[
{date:'2026-09-28',ids:[1,10,17]},{date:'2026-09-29',ids:[2,11,18]},{date:'2026-09-30',ids:[3,15,19]},
{date:'2026-10-01',ids:[1,10,17]},{date:'2026-10-02',ids:[2,11,18]},{date:'2026-10-03',ids:[3,15,19]},
{date:'2026-10-04',ids:[1,10,17]},{date:'2026-10-05',ids:[6,12,24]},{date:'2026-10-06',ids:[7,16,21]},
{date:'2026-10-07',ids:[8,13,22]},{date:'2026-10-08',ids:[6,12,24]},{date:'2026-10-09',ids:[7,13,21]},
{date:'2026-10-10',ids:[7,16,22]},{date:'2026-10-11',ids:[6,13,24]},{date:'2026-10-12',ids:[4,14,20]},
{date:'2026-10-13',ids:[5,9,23]},{date:'2026-10-14',ids:[2,15,24]},{date:'2026-10-15',ids:[4,14,20]},
{date:'2026-10-16',ids:[5,9,23]},{date:'2026-10-17',ids:[2,15,24]},{date:'2026-10-18',ids:[4,14,20]}
];
let seeded=false;
SEED_MENUS.forEach(m=>{if(!DB.menus.some(x=>x.date===m.date)){DB.menus.push({...m,note:''});seeded=true}});
if(seeded)try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('保存できませんでした（容量不足の可能性）')}}
function allCards(){const m=BASE.map(b=>DB.over[b.id]?norm(DB.over[b.id]):b);DB.custom.forEach(c=>{if(!BASE.some(b=>b.id===c.id))m.push(norm(c))});return m.sort((a,b)=>a.id-b.id)}
const byId=id=>allCards().find(c=>c.id===id);
const isFav=id=>DB.favs.includes(id);
function allergensOf(c){const a=Object.keys(ALLERGENS).filter(k=>c.ing.some(i=>ALLERGENS[k].some(w=>i.n.includes(w))));c.allergens.forEach(x=>{if(!a.includes(x))a.push(x)});return a}
const avoidHit=c=>allergensOf(c).some(a=>DB.avoid.includes(a));

/* ================= 写真（元写真は各自登録。未登録時は器のイラスト） ================= */
function rnd(seed){let s=seed*9301+49297;return()=>(s=(s*9301+49297)%233280)/233280}
function photoHTML(c){
  if(c.photo)return `<img src="${c.photo}" alt="">`;
  const r=rnd(c.id+7),g=groupOf(c.cat),k=c.id%3;
  let bowl;
  if(k===1)bowl=`<rect x="18" y="24" width="164" height="104" rx="18" fill="url(#gRim)"/><rect x="30" y="34" width="140" height="82" rx="12" fill="url(#gIn)"/>`;
  else if(k===2)bowl=`<ellipse cx="100" cy="76" rx="90" ry="52" fill="url(#gRim)"/><ellipse cx="100" cy="74" rx="76" ry="40" fill="url(#gIn)"/>`;
  else bowl=`<ellipse cx="100" cy="78" rx="80" ry="60" fill="url(#gRim)"/><ellipse cx="100" cy="76" rx="66" ry="47" fill="url(#gIn)"/>`;
  let b='';const lo=g==='shu'?190:80,hi=g==='shu'?240:200;
  for(let i=0;i<14;i++){const x=58+r()*84,y=52+r()*46,rad=3+r()*8,v=Math.round(lo+r()*(hi-lo));b+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" fill="rgb(${v},${v},${v})" opacity=".85"/>`}
  return `<svg viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice" role="img" aria-label="料理のイメージ">${bowl}${b}</svg>`}

/* ================= 状態 ================= */
const S={tab:'home',sel:[null,null,null],editing:null,f:{q:'',g:'',stage:'',fav:false,open:false},stack:[]};

function filtered(){const f=S.f,q=f.q.trim();
  return allCards().filter(c=>{
    if(f.g&&groupOf(c.cat)!==f.g)return false;
    if(f.stage&&c.stage!==f.stage)return false;
    if(f.fav&&!isFav(c.id))return false;
    if(avoidHit(c))return false;
    if(q){if(/^\d+$/.test(q))return String(c.id).startsWith(q);
      return c.name.includes(q)||c.ing.some(i=>i.n.includes(q))}
    return true})}

/* ================= 部品 ================= */
function cardMini(c,mode){
  const idx=S.sel.indexOf(c.id),g=groupOf(c.cat),al=allergensOf(c);
  return `<div class="bag g-${g} ${idx>=0?'on':''}" role="button" tabindex="0" data-act="${mode==='pick'?'pick':'open'}" data-id="${c.id}" aria-label="${c.id}番 ${esc(c.name)}">
    <span class="tab">${c.id}</span>${idx>=0?`<span class="badge">${idx+1}</span>`:''}
    <button class="star" data-act="fav" data-id="${c.id}" aria-label="お気に入り">${isFav(c.id)?'★':'☆'}</button>
    <span class="paper"><span class="ph">${photoHTML(c)}</span><span class="pill">${esc(c.cat)}</span><span class="nm">${esc(c.name)}</span>
    <span class="al">${al.map(a=>`<i>${a}</i>`).join('')}</span></span></div>`}
function gridHTML(mode){const l=filtered();return l.length?l.map(c=>cardMini(c,mode)).join(''):`<p class="dim" style="grid-column:1/-1">条件に合うカードがありません。絞り込みをゆるめてみてください。</p>`}
function filterBar(){const f=S.f;
  return `<div class="fbar"><input id="q" type="search" inputmode="search" placeholder="番号・献立名・材料で検索" value="${esc(f.q)}" aria-label="検索"><button class="chip ${f.open||f.stage||f.fav||DB.avoid.length?'on':''}" data-act="ftoggle">絞り込み</button></div>
  <div class="chips">${Object.keys(GLABEL).map(k=>`<button class="chip ${f.g===k?'on':''} ${k?'g-'+k:''}" data-act="fg" data-v="${k}">${k?'<span class="dot"></span>':''}${GLABEL[k]}</button>`).join('')}</div>
  ${f.open?`<div class="fpanel"><label>月齢 <select id="fstage"><option value="">すべて</option>${STAGES.map(s=>`<option ${f.stage===s?'selected':''}>${s}</option>`).join('')}</select>
    <button class="chip ${f.fav?'on':''}" data-act="ffav">★ お気に入りのみ</button></label>
    <div><div class="sub">避ける食材（含むカードを一覧から外します）</div><div class="chips">${Object.keys(ALLERGENS).map(a=>`<button class="chip ${DB.avoid.includes(a)?'on':''}" data-act="avoid" data-v="${a}">${a}</button>`).join('')}</div></div></div>`:''}
  <div class="cnt" id="cnt">${filtered().length}枚</div>`}
function pageTop(t){return `<div class="hdr"><span class="logo">🍙 離乳食カード</span><button class="chip" data-act="data">データ</button></div>${t?`<h2 class="pt">${t}</h2>`:''}`}
function menuRows(m){return m.ids.map((id,i)=>{const c=byId(id);return `<div class="mr"><i class="no">${i+1}</i><span class="mt">${SLOTS[i]||''}</span>${c?`<span class="mn">${esc(c.name)}</span><span class="mc g-${groupOf(c.cat)}"><span class="tab">${c.id}</span></span>`:'<span class="mn dim">（削除されたカード）</span>'}</div>`}).join('')}
function menuCard(m){return `<div class="sheet click" data-act="openMenu" data-date="${m.date}"><div class="sh"><b>${fmtDate(m.date)}</b><span>${m.ids.length}品</span></div>${menuRows(m)}${m.note?`<p class="note-l">📝 ${esc(m.note)}</p>`:''}</div>`}
function board(){const n=S.sel.filter(Boolean).length;
  return `<section class="board"><div class="board-h">1日の献立ボード<span>${n}/${SLOTS.length}</span></div><div class="slots">${SLOTS.map((lb,i)=>{const c=S.sel[i]?byId(S.sel[i]):null;
   return `<div class="slot" data-slot="${i}"><i class="no">${i+1}</i><em>${lb}</em>${c?`<div class="bag g-${groupOf(c.cat)}" data-cid="${c.id}"><span class="tape"></span><button class="x" data-act="rm" data-i="${i}" aria-label="はずす">✕</button><span class="tab">${c.id}</span><span class="paper"><span class="ph">${photoHTML(c)}</span><span class="pill">${esc(c.cat)}</span><span class="nm">${esc(c.name)}</span></span></div>`:`<div class="empty">カードを<br>えらんで<br>貼る</div>`}</div>`}).join('')}</div></section>`}

/* ================= 画面 ================= */
function vHome(){const t=todayStr(),m=DB.menus.find(x=>x.date===t);
  const rec=[...DB.menus].sort((a,b)=>b.date.localeCompare(a.date)).filter(x=>x.date!==t).slice(0,3);
  const cs=allCards(),cnt=g=>cs.filter(c=>groupOf(c.cat)===g).length;
  return pageTop()+`<section class="hero"><h1>毎日の離乳食を<br>無理なく、楽しく</h1>
    <div class="stats"><span><b>${cs.length}</b>献立カード</span><span><b>${SLOTS.length}</b>枚で1日分</span><span><b>${DB.menus.length}</b>保存した献立</span></div>
    <button class="btn pri lg" style="width:100%" data-act="nav" data-v="make">まずは献立をつくる</button>
    <button class="btn lg" style="width:100%" data-act="autonew">🎲 おまかせで作る</button></section>
    <section class="panel"><p>カードの種類からえらぶ</p><div class="tiles">${['shu','main','side','all'].map(g=>`<button class="tile g-${g}" data-act="tile" data-v="${g}"><span>${cnt(g)}</span>${GLABEL[g]}</button>`).join('')}</div></section>
    <h3 class="h3">今日の献立</h3><section class="sheet"><div class="sh"><b>${fmtDate(t)}</b><span>${m?m.ids.length+'品':''}</span></div>

    <h4>【材料】</h4><div class="ig">${c.ing.map(i=>`<div><span>${esc(i.n)}</span><span>${esc(i.a)}</span></div>`).join('')}</div>

     <h4>【材料】</h4><div class="ig">${c.ing.map(x=>`<div><span>${esc(x.n)}</span><span>${esc(x.a)}</span></div>`).join('')}</div>
     <h4>【作り方】</h4><ol class="st">${c.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
     ${c.tip?`<div class="tip">💡 ${esc(c.tip)}</div>`:''}${c.note?`<div class="tip">📝 ${esc(c.note)}</div>`:''}
     <button class="btn" data-act="open" data-id="${c.id}">くわしいレシピを見る</button></section>`).join('')}
   <div class="acts">${o.date?`<button class="btn" data-act="mEdit" data-date="${o.date}">編集</button><button class="btn" data-act="mCopy" data-date="${o.date}">コピー</button><button class="btn warn" data-act="mDel" data-date="${o.date}">削除</button>`:`<button class="btn pri" data-act="saveOpen">この献立を保存</button>`}</div></div>`}

function oSave(o){const d=S.editing||todayStr();
  return `<div class="sheetm"><h3>献立を保存</h3><label for="sd">日付</label><input id="sd" type="date" value="${d}"><div class="err" id="serr" style="color:#8a5a00"></div>

function oEdit(o){const d=o.draft,base=BASE.some(b=>b.id===o.origId);
  return ovHead(o.origId?'カードを編集':'カードを追加')+`<div class="ovb"><div class="form">

   <label>写真<input type="file" id="f_photo" accept="image/*"></label>${d.photo?`<div class="ph pv"><img src="${d.photo}" alt=""></div><button class="btn sm" data-act="rmphoto">写真を消す</button>`:''}
   <h4>材料・分量</h4><div>${d.ing.map((x,i)=>`<div class="irow"><input class="in" placeholder="材料" value="${esc(x.n)}"><input class="ia" placeholder="分量" value="${esc(x.a)}"><button class="x2" data-act="rming" data-i="${i}" aria-label="行を削除">✕</button></div>`).join('')}</div><button class="btn sm" data-act="adding">＋ 材料を追加</button>
   <label>作り方（1行に1手順）<textarea id="f_steps" rows="5">${esc(d.steps.join('\n'))}</textarea></label>
   <label>コツ<textarea id="f_tip" rows="2">${esc(d.tip)}</textarea></label>
   <div class="two"><label>ひとこと種類<select id="f_sk"><option value="swap" ${d.arr&&!d.swap?'':'selected'}>食材を置き換え</option><option value="arr" ${d.arr&&!d.swap?'selected':''}>アレンジテク</option></select></label><label>内容<input id="f_sv" value="${esc(d.swap||d.arr)}"></label></div>
   <label>注意事項<input id="f_caution" placeholder="例：初めての食材。少量から" value="${esc(d.caution)}"></label>
   <label>追加のアレルギー食材（カンマ区切り）<input id="f_alg" placeholder="例：ごま、えび" value="${esc(d.allergens.join('、'))}"></label>

function oData(o){return `<div class="sheetm"><h3>データ管理</h3><p style="font-size:12.5px;line-height:1.6;margin:0 0 6px">全カードと保存した献立をJSONで書き出せます。編集したJSONを貼って「読み込む」と、カードをまとめて追加・更新できます（番号が同じカードは上書き）。材料は <code>"材料|分量;材料|分量"</code> の形式です。</p>
  <textarea id="dj" class="big" spellcheck="false" placeholder="ここに書き出し／貼り付け">${esc(o.text||'')}</textarea>
  <div class="err" id="derr"></div>
  <div class="acts"><button class="btn" data-act="dExport">書き出す</button><button class="btn pri" data-act="dImport">読み込む</button></div>

/* ================= 描画 ================= */
function render(){
  const y=window.scrollY,ls=[...document.querySelectorAll('#ov .layer')].map(l=>l.scrollTop);
  $('#main').innerHTML=({home:vHome,cards:vCards,make:vMake,history:vHist})[S.tab]();
  renderNav();
  $('#ov').innerHTML=S.stack.map(o=>`<div class="layer ${o.t==='save'||o.t==='data'?'modal':''}">${({detail:oDetail,day:oDay,edit:oEdit,save:oSave,data:oData})[o.t](o)}</div>`).join('');
  document.querySelectorAll('#ov .layer').forEach((l,i)=>{if(ls[i])l.scrollTop=ls[i]});
  $('#nav').style.display=S.stack.length?'none':'flex';
  document.body.style.overflow=S.stack.length?'hidden':'';
  bindBoard();window.scrollTo(0,y)}
const push=o=>{S.stack.push(o);render()};
const pop=()=>{S.stack.pop();render()};

/* ================= 操作 ================= */
function pick(id){const i=S.sel.indexOf(id);
  if(i>=0){S.sel[i]=null;return true}
  const e=S.sel.indexOf(null);if(e<0){toast(`${SLOTS.length}枚までです。ボードの✕ではずしてください`);return false}
  S.sel[e]=id;return true}
function auto(){
  if(S.sel.every(Boolean))S.sel=S.sel.map(()=>null);
  const cur=S.sel.filter(Boolean);let pool=allCards().filter(c=>!cur.includes(c.id)&&!avoidHit(c));
  const want=['shu','main','side'].filter(g=>!cur.some(id=>groupOf(byId(id).cat)===g));
  S.sel.forEach((v,i)=>{if(v)return;const g=want.shift();let c=pool.filter(x=>groupOf(x.cat)===g);if(!c.length)c=pool;if(!c.length)return;
    const p=c[Math.floor(Math.random()*c.length)];S.sel[i]=p.id;pool=pool.filter(x=>x.id!==p.id)})}
function draftFrom(c){return c?JSON.parse(JSON.stringify(c)):norm({id:'',name:'',cat:'主菜',stage:'7〜8か月',time:'',ing:[{n:'',a:''}],steps:[]})}
function formRead(o){const d=o.draft;const g=id=>document.getElementById(id);if(!g('f_name'))return d;
  d.id=g('f_id').disabled?d.id:(g('f_id').value===''?'':+g('f_id').value);d.name=g('f_name').value.trim();d.cat=g('f_cat').value;d.stage=g('f_stage').value;d.time=+g('f_time').value||0;
  d.ing=[...document.querySelectorAll('.irow')].map(r=>({n:r.querySelector('.in').value.trim(),a:r.querySelector('.ia').value.trim()}));
  d.steps=g('f_steps').value.split('\n').map(x=>x.trim()).filter(Boolean);d.tip=g('f_tip').value.trim();
  const sv=g('f_sv').value.trim();d.swap=g('f_sk').value==='swap'?sv:'';d.arr=g('f_sk').value==='arr'?sv:'';
  d.caution=g('f_caution').value.trim();d.allergens=g('f_alg').value.split(/[,、]/).map(x=>x.trim()).filter(Boolean);d.note=g('f_note').value.trim();return d}
function readPhoto(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.78))};im.src=fr.result};fr.readAsDataURL(file)})}
function saveCard(){const o=S.stack[S.stack.length-1],d=formRead(o),err=t=>{$('#ferr').textContent=t};
  if(!d.id||d.id<1)return err('番号を入力してください');if(!d.name)return err('献立名を入力してください');
  const clash=allCards().find(c=>c.id===d.id&&c.id!==o.origId);if(clash)return err(`番号${d.id}はすでに使われています（${clash.name}）`);
  d.ing=d.ing.filter(x=>x.n);const card=norm(d);
  if(BASE.some(b=>b.id===card.id))DB.over[card.id]=card;
  else{const i=DB.custom.findIndex(x=>x.id===o.origId);if(i>=0)DB.custom[i]=card;else DB.custom.push(card)}
  persist();S.stack.pop();render();toast('カードを保存しました')}
function doSave(){const date=$('#sd').value,note=$('#sn').value.trim(),day=S.stack.find(x=>x.t==='day');
  if(!date){$('#serr').textContent='日付を選んでください';return}
  if(S.editing&&S.editing!==date)DB.menus=DB.menus.filter(m=>m.date!==S.editing);
  DB.menus=DB.menus.filter(m=>m.date!==date);DB.menus.push({date,ids:day.ids.slice(),note});persist();
  S.editing=null;S.sel=SLOTS.map(()=>null);S.stack=[];S.tab='history';render();window.scrollTo(0,0);toast(`${fmtDate(date)} の献立を保存しました`)}
function exportAll(){return JSON.stringify({version:1,cards:allCards().map(c=>({...c,ing:ingStr(c.ing)})),menus:DB.menus,favs:DB.favs},null,1)}
function importAll(txt){let j;try{j=JSON.parse(txt)}catch(e){return '形式が正しくありません（JSONを確認してください）'}
  const cards=Array.isArray(j)?j:(j.cards||[]);let n=0;
  cards.forEach(c=>{if(!c||!c.id||!c.name)return;const k=norm(c);if(BASE.some(b=>b.id===k.id))DB.over[k.id]=k;else{const i=DB.custom.findIndex(x=>x.id===k.id);if(i>=0)DB.custom[i]=k;else DB.custom.push(k)}n++});
  if(j.menus)j.menus.forEach(m=>{if(m.date&&Array.isArray(m.ids)){DB.menus=DB.menus.filter(x=>x.date!==m.date);DB.menus.push({date:m.date,ids:m.ids.map(Number),note:m.note||''})}});
  if(j.favs)j.favs.forEach(f=>{if(!DB.favs.includes(f))DB.favs.push(f)});
  persist();return n+'枚のカードを読み込みました'}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=+a.dataset.id,top=S.stack[S.stack.length-1];
  switch(act){
    case'nav':S.tab=a.dataset.v;S.stack=[];render();window.scrollTo(0,0);break;
    case'tile':S.f.g=a.dataset.v;S.tab='cards';S.stack=[];render();window.scrollTo(0,0);break;
    case'open':push({t:'detail',id});break;
    case'pick':pick(id);render();break;
    case'pickd':if(pick(id))toast(S.sel.includes(id)?'ボードに貼りました':'ボードからはずしました');render();break;
    case'rm':S.sel[+a.dataset.i]=null;render();break;
    case'auto':auto();render();break;
    case'autonew':S.sel=SLOTS.map(()=>null);auto();S.tab='make';render();window.scrollTo(0,0);break;
    case'clear':S.sel=SLOTS.map(()=>null);render();break;
    case'viewDay':push({t:'day',ids:S.sel.slice(),date:null,note:''});break;
    case'openMenu':{const m=DB.menus.find(x=>x.date===a.dataset.date);if(m)push({t:'day',ids:m.ids.slice(),date:m.date,note:m.note});break}
    case'back':pop();break;
    case'fav':e.stopPropagation();DB.favs=isFav(id)?DB.favs.filter(x=>x!==id):[...DB.favs,id];persist();render();break;
    case'ftoggle':S.f.open=!S.f.open;render();break;
    case'fg':S.f.g=a.dataset.v;render();break;
    case'ffav':S.f.fav=!S.f.fav;render();break;
    case'avoid':{const v=a.dataset.v;DB.avoid=DB.avoid.includes(v)?DB.avoid.filter(x=>x!==v):[...DB.avoid,v];persist();render();break}
    case'saveOpen':push({t:'save',note:''});break;
    case'doSave':doSave();break;
    case'mEdit':{const m=DB.menus.find(x=>x.date===a.dataset.date);if(!m)break;S.sel=SLOTS.map((_,i)=>m.ids[i]??null);S.editing=m.date;S.tab='make';S.stack=[];render();window.scrollTo(0,0);toast('ボードで編集して、もう一度保存してください');break}
    case'mCopy':{const m=DB.menus.find(x=>x.date===a.dataset.date);if(!m)break;S.sel=SLOTS.map((_,i)=>m.ids[i]??null);S.editing=null;S.tab='make';S.stack=[];render();window.scrollTo(0,0);toast('コピーしました。日付を選んで保存できます');break}
    case'mDel':if(arm('m'+a.dataset.date,'もう一度押すと削除します')){DB.menus=DB.menus.filter(x=>x.date!==a.dataset.date);persist();S.stack=[];render();toast('削除しました')}break;
    case'newcard':{const ids=allCards().map(c=>c.id);push({t:'edit',origId:null,draft:{...draftFrom(null),id:Math.max(0,...ids)+1}});break}
    case'edit':push({t:'edit',origId:id,draft:draftFrom(byId(id))});break;
    case'delcard':if(arm('c'+id,'もう一度押すとカードを削除します')){DB.custom=DB.custom.filter(x=>x.id!==id);S.sel=S.sel.map(x=>x===id?null:x);persist();S.stack=[];render();toast('削除しました')}break;
    case'adding':top.draft=formRead(top);top.draft.ing.push({n:'',a:''});render();break;
    case'rming':top.draft=formRead(top);top.draft.ing.splice(+a.dataset.i,1);if(!top.draft.ing.length)top.draft.ing.push({n:'',a:''});render();break;
    case'rmphoto':top.draft=formRead(top);top.draft.photo=null;render();break;
    case'savecard':saveCard();break;
    case'data':push({t:'data',text:''});break;
    case'dExport':{top.text=exportAll();render();const t=$('#dj');t.focus();t.select();break}
    case'dImport':{const msg=importAll($('#dj').value);if(msg.includes('読み込みました')){S.stack.pop();render();toast(msg)}else{top.text=$('#dj').value;render();$('#derr').textContent=msg}break}
  }});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.bag[data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.f.q=e.target.value;$('#grid').innerHTML=gridHTML(S.tab==='make'?'pick':'open');$('#cnt').textContent=filtered().length+'枚'}
  if(e.target.id==='sd'){const ex=DB.menus.some(m=>m.date===e.target.value&&m.date!==S.editing);$('#serr').textContent=ex?'この日の献立があります。保存すると上書きされます':''}});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='fstage'){S.f.stage=t.value;render()}
  else if(t.dataset&&t.dataset.note){const id=+t.dataset.note,c=byId(id);if(!c)return;const k={...c,note:t.value.trim()};
    if(BASE.some(b=>b.id===id))DB.over[id]=k;else{const i=DB.custom.findIndex(x=>x.id===id);if(i>=0)DB.custom[i]=k}persist();toast('メモを保存しました')}
  else if(t.id==='f_photo'&&t.files[0]){const top=S.stack[S.stack.length-1];top.draft=formRead(top);top.draft.photo=await readPhoto(t.files[0]);render()}});

/* ボード上のカードをドラッグして並び替え（タップで詳細） */
function bindBoard(){
  document.querySelectorAll('.slot .bag').forEach(el=>{
    el.addEventListener('pointerdown',e=>{
      if(e.target.closest('[data-act="rm"]'))return;
      const from=+el.closest('.slot').dataset.slot,id=+el.dataset.cid,sx=e.clientX,sy=e.clientY;let drag=false;
      try{el.setPointerCapture(e.pointerId)}catch(_){}
      const slotAt=x=>{let t=-1;document.querySelectorAll('.slot').forEach((s,i)=>{const r=s.getBoundingClientRect();if(x>r.left&&x<r.right)t=i});return t};
      const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;
        if(!drag&&Math.hypot(dx,dy)>8){drag=true;el.classList.add('dragging')}
        if(drag){el.style.transform=`translate(${dx}px,${dy}px) rotate(3deg)`;const t=slotAt(ev.clientX);document.querySelectorAll('.slot').forEach((s,i)=>s.classList.toggle('over',i===t&&i!==from))}};
      const up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
        if(drag){const t=slotAt(ev.clientX);if(t>=0&&t!==from&&ev.type==='pointerup')[S.sel[from],S.sel[t]]=[S.sel[t],S.sel[from]];render()}
        else if(ev.type==='pointerup')push({t:'detail',id})};
      el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)})})}

render();
</script>
